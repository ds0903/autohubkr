# Окремий блок server для АвтоХаб КР. Інші сайти на сервері не чіпаємо: відповідаємо лише на запити
# з потрібним Host (IP або домен), решта лишається за default_server.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;   # фото заявок

    location /static/ {
        alias /srv/autohubkr/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Публічні тільки фото виконавців (проходять модерацію). Фото заявок і чеки містять персональні дані
    # й назовні не віддаються.
    location /media/providers/ {
        alias /srv/autohubkr/app/media/providers/;
        expires 7d;
    }
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
